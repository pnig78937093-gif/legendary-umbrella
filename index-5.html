<style>
*{box-sizing:border-box}
body{margin:0;background:#f0f2f5;font-family:Arial,"Noto Sans Thai",sans-serif;color:#1c1e21}
.container{max-width:700px;margin:auto;padding:18px}
.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 3px 15px rgba(0,0,0,.12)}

.note{font-size:13px;color:#65676b;text-align:center;line-height:1.5;margin-bottom:0}
@media(max-width:430px){.container{padding:10px}.card{padding:14px}h1{font-size:21px}}
</style>

<p class="note">หลังดาวน์โหลดแล้ว สามารถนำรูปไปตั้งเป็นรูปโปรไฟล์ Facebook ได้ด้วยตัวเอง<br>เว็บไซต์นี้จะไม่ขอรหัสผ่าน Facebook</p>
</div></div>
<script>
let selected=document.querySelector(".item.selected");
document.querySelectorAll(".item").forEach(function(item){
 item.addEventListener("click",function(){
  document.querySelectorAll(".item").forEach(function(x){x.classList.remove("selected");});
  item.classList.add("selected"); selected=item;
 });
});
document.getElementById("download").addEventListener("click",function(){
 const a=document.createElement("a");
 a.href=selected.querySelector("img").src;
 a.download=selected.dataset.file;
 document.body.appendChild(a); a.click(); a.remove();
});
</script>
</body>
</html>
